name: Deploy Swarm

on:

  workflow_run:

    workflows:

      - Build and Push

    types:

      - completed

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Backend

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.AWS_HOST }}

          username: ${{ secrets.AWS_USER }}

          key: ${{ secrets.AWS_SSH_KEY }}

          script: |

            docker pull kevinrp17/banco-backend:latest

            docker service update \
            --image kevinrp17/banco-backend:latest \
            banco_backend