name: Build and Push

on:
  push:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: |
          docker build -t kevinrp17/banco-backend:latest ./backend

      - name: Push Backend
        run: |
          docker push kevinrp17/banco-backend:latest

  frontend:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend
        run: |
          docker build -t kevinrp17/banco-frontend:latest ./frontend

      - name: Push Frontend
        run: |
          docker push kevinrp17/banco-frontend:latest